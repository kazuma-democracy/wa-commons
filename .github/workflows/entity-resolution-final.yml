name: entity-resolution-final

on:
  pull_request:
    paths:
      - 'src/wa_commons/identity/**'
      - 'scripts/run_final_entity_resolution_policy.py'
      - 'tests/test_final_entity_resolution_policy.py'
      - 'docs/ENTITY_RESOLUTION.md'
      - 'docs/results/M1_2_FINAL_ENTITY_RESOLUTION_DECISION.md'
      - '.github/workflows/entity-resolution-final.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Generate final policy report
        run: python scripts/run_final_entity_resolution_policy.py
      - name: Show report
        run: cat artifacts/entity-resolution-final/final-policy-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: entity-resolution-final-v02
          path: artifacts/entity-resolution-final/
          retention-days: 30

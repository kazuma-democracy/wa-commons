name: mod-procurement-pilot

on:
  pull_request:
    paths:
      - 'src/wa_commons/evidence/**'
      - 'src/wa_commons/identity/**'
      - 'scripts/run_mod_procurement_pilot.py'
      - 'tests/test_mod_procurement_adapter.py'
      - 'schemas/evidence-claim.v0.1.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/mod-procurement-pilot.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test adapter
        run: python -m pytest -q tests/test_mod_procurement_adapter.py
      - name: Run fixed MOD procurement snapshot
        run: python scripts/run_mod_procurement_pilot.py artifacts/mod-procurement-pilot
      - name: Show report
        run: cat artifacts/mod-procurement-pilot/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: mod-procurement-pilot-v01
          path: |
            artifacts/mod-procurement-pilot/observations.json
            artifacts/mod-procurement-pilot/claims.json
            artifacts/mod-procurement-pilot/report.json
          retention-days: 30

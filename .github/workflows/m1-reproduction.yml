name: m1-reproduction
on:
  pull_request:
    paths:
      - 'src/wa_commons/evidence/**'
      - 'src/wa_commons/identity/**'
      - 'scripts/run_m1_reproduction.py'
      - 'tests/test_m1_reproduction.py'
      - 'schemas/evidence-claim.v0.1.schema.json'
      - 'schemas/examples/evidence-claim.examples.json'
      - 'docs/M1_ACCEPTANCE.md'
      - 'docs/THREAT_MODEL.md'
      - 'docs/results/M1_7_REPRODUCTION_V01.md'
      - '.github/workflows/m1-reproduction.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Install fixed OCR/runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-jpn
      - name: Targeted M1 reproduction tests
        run: python -m pytest -q tests/test_m1_reproduction.py
      - name: Reproduce M1 graph from clean checkout
        run: python scripts/run_m1_reproduction.py
      - name: Re-run and prove deterministic graph hash
        run: |
          first=$(python - <<'PY'
          import json
          print(json.load(open('artifacts/m1-reproduction/report.json'))['canonical_graph_sha256'])
          PY
          )
          rm -rf artifacts/m1-reproduction
          python scripts/run_m1_reproduction.py
          second=$(python - <<'PY'
          import json
          print(json.load(open('artifacts/m1-reproduction/report.json'))['canonical_graph_sha256'])
          PY
          )
          test "$first" = "$second"
          echo "stable canonical_graph_sha256=$second"
      - name: Publish derived reproduction evidence only
        uses: actions/upload-artifact@v4
        with:
          name: m1-reproduction-v01
          path: |
            artifacts/m1-reproduction/canonical-graph.json
            artifacts/m1-reproduction/report.json
          retention-days: 30

name: yente-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/wa_commons/identity/benchmark**'
      - 'scripts/export_yente_benchmark.py'
      - 'scripts/run_yente_benchmark.py'
      - 'tools/yente-benchmark/**'
      - '.github/workflows/yente-benchmark.yml'
  workflow_dispatch:

jobs:
  yente:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Export WA benchmark dataset
        run: python scripts/export_yente_benchmark.py
      - name: Start Elasticsearch
        run: docker compose -f tools/yente-benchmark/docker-compose.yml up -d index
      - name: Reindex pinned custom dataset
        run: docker compose -f tools/yente-benchmark/docker-compose.yml run --rm app yente reindex --force
      - name: Start yente API
        run: docker compose -f tools/yente-benchmark/docker-compose.yml up -d app
      - name: Wait for yente
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker compose -f tools/yente-benchmark/docker-compose.yml logs app index
          exit 1
      - name: Measure yente threshold curve
        run: python scripts/run_yente_benchmark.py
      - name: Print chosen threshold
        run: python - <<'PY'
          import json
          p=json.load(open('artifacts/yente-benchmark/yente_report.json'))
          print(json.dumps(p['chosen'], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yente-benchmark-v01
          path: |
            artifacts/yente-benchmark/yente_report.json
            artifacts/yente-benchmark/yente_rows.json
            artifacts/yente-benchmark/queries.json
          retention-days: 30
      - name: Service logs on failure
        if: failure()
        run: docker compose -f tools/yente-benchmark/docker-compose.yml logs app index || true

name: political-finance-pilot
on:
  pull_request:
    paths:
      - 'src/wa_commons/evidence/political_finance.py'
      - 'scripts/run_political_finance_pilot.py'
      - 'tests/test_political_finance_adapter.py'
      - 'schemas/evidence-claim.v0.1.schema.json'
      - '.github/workflows/political-finance-pilot.yml'
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Targeted tests
        run: python -m pytest -q tests/test_political_finance_adapter.py
      - name: Install bounded OCR dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-jpn
      - name: Run fixed official filing pilot
        run: python scripts/run_political_finance_pilot.py
      - name: Publish derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: political-finance-pilot-v01
          path: |
            artifacts/political-finance-pilot/observations.json
            artifacts/political-finance-pilot/report.json
          retention-days: 30

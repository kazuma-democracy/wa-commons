name: political-finance-probe
on:
  pull_request:
    paths:
      - 'src/wa_commons/evidence/political_finance.py'
      - 'scripts/probe_political_finance_source.py'
      - 'pyproject.toml'
      - '.github/workflows/political-finance-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/probe_political_finance_source.py

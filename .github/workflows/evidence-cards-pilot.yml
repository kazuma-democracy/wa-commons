name: evidence-cards-pilot
on:
  pull_request:
    paths:
      - 'src/wa_commons/evidence/cards.py'
      - 'scripts/run_evidence_cards_pilot.py'
      - 'tests/test_evidence_cards.py'
      - 'schemas/evidence-claim.v0.1.schema.json'
      - 'schemas/examples/evidence-claim.examples.json'
      - '.github/workflows/evidence-cards-pilot.yml'
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Targeted tests
        run: python -m pytest -q tests/test_evidence_cards.py
      - name: Generate schema-backed cards from fixed inputs
        run: python scripts/run_evidence_cards_pilot.py
      - name: Regenerate and verify semantic hash is stable
        run: |
          first=$(python - <<'PY'
          import json
          print(json.load(open('artifacts/evidence-cards-pilot/report.json'))['semantic_sha256'])
          PY
          )
          rm -rf artifacts/evidence-cards-pilot
          python scripts/run_evidence_cards_pilot.py
          second=$(python - <<'PY'
          import json
          print(json.load(open('artifacts/evidence-cards-pilot/report.json'))['semantic_sha256'])
          PY
          )
          test "$first" = "$second"
          echo "stable semantic_sha256=$second"
      - name: Upload generated cards only
        uses: actions/upload-artifact@v4
        with:
          name: evidence-cards-pilot-v01
          path: |
            artifacts/evidence-cards-pilot/cards/
            artifacts/evidence-cards-pilot/cards.json
            artifacts/evidence-cards-pilot/report.json
          retention-days: 30

services:
  index:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      - node.name=index
      - cluster.name=wa-yente-benchmark
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - yente-index:/usr/share/elasticsearch/data

  app:
    image: ghcr.io/opensanctions/yente:5.5.0
    depends_on:
      index:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      YENTE_INDEX_TYPE: elasticsearch
      YENTE_INDEX_URL: http://index:9200
      YENTE_MANIFEST: /data/manifest.yml
      YENTE_AUTO_REINDEX: "false"
      YENTE_INDEX_NAME: wa-er-benchmark
    volumes:
      - ../../artifacts/yente-benchmark:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  yente-index:
